name: CI

on:
  push:
    branches: [main]
  pull_request:
  # the release workflow runs the same job before it publishes anything
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # node:sqlite (and its online backup) needs Node 24; the app itself runs on Node
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # bun only installs the dependencies from bun.lock
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test
