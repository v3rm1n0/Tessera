<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Voreinlass</title>
  <link rel="stylesheet" href="/css/app.css">
  <script>
    (function () {
      var p = localStorage.getItem('voreinlass_theme');
      var eff = (p === 'light' || p === 'dark') ? p
        : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = eff;
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🎟️</text></svg>">
</head>
<body>
  <div id="app"></div>
  <script src="/vendor/jsQR.js"></script>
  <script src="/vendor/qrcode-generator.js"></script>
  <script src="/vendor/jszip.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
